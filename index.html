<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التسجيل في جلسات أساسيات البرمجة - النظام التقني الذكي للمبرمج بهاء الدين الحسين</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .container {
    width: 100%; max-width: 550px; background: #fff;
    border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff; padding: 25px 20px; text-align: center;
  }
  header h1 { font-size: 1.4rem; margin-bottom: 6px; }
  header p { opacity: 0.9; font-size: 0.95rem; }
  form { padding: 25px 20px; }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; margin-bottom: 6px; color: #333;
    font-weight: 600; font-size: 0.95rem;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%; padding: 12px 14px; border: 2px solid #e0e7ff;
    border-radius: 8px; font-size: 1rem; transition: all 0.3s; background: #f8faff;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none; border-color: #2a5298; background: #fff;
    box-shadow: 0 0 0 3px rgba(42,82,152,0.1);
  }
  .radio-group {
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .radio-group label {
    display: flex; align-items: center; gap: 6px;
    font-weight: 500; cursor: pointer;
    padding: 10px 16px; border: 2px solid #e0e7ff;
    border-radius: 8px; background: #f8faff;
    transition: all 0.2s; margin: 0;
  }
  .radio-group label:hover { border-color: #2a5298; }
  .radio-group input[type="radio"] {
    width: auto; accent-color: #2a5298; cursor: pointer;
  }
  .radio-group label:has(input:checked) {
    border-color: #2a5298; background: #eef2ff;
    color: #2a5298; font-weight: 600;
  }
  .btn-submit {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff; border: none; border-radius: 8px;
    font-size: 1.05rem; font-weight: bold; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s; margin-top: 8px;
  }
  .btn-submit:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(42,82,152,0.4);
  }
  .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
  .toast {
    position: fixed; bottom: 25px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #10b981; color: #fff; padding: 14px 25px;
    border-radius: 8px; font-weight: bold; opacity: 0;
    transition: all 0.4s; z-index: 1000; font-size: 0.95rem;
    max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #ef4444; }

  /* ============================================ */
  /* نافذة النجاح مع زر الواتساب */
  /* ============================================ */
  .success-modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s, visibility 0.4s;
    padding: 20px;
  }
  .success-modal.show {
    opacity: 1;
    visibility: visible;
  }
  .success-content {
    background: #fff;
    border-radius: 20px;
    padding: 35px 25px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    transform: scale(0.7);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .success-modal.show .success-content {
    transform: scale(1);
  }
  .success-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #10b981, #059669);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 2.5rem;
    color: #fff;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
  }
  .success-content h2 {
    color: #2a5298;
    font-size: 1.5rem;
    margin-bottom: 12px;
  }
  .success-content p {
    color: #555;
    font-size: 1rem;
    margin-bottom: 10px;
    line-height: 1.6;
  }
  .success-content .note {
    font-size: 0.9rem;
    color: #888;
    margin-bottom: 20px;
  }
  .btn-whatsapp {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 12px;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-whatsapp:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
  }
  .btn-close {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: #888;
    border: 2px solid #e0e7ff;
    border-radius: 10px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-close:hover {
    background: #f8faff;
    color: #2a5298;
    border-color: #2a5298;
  }

  @media (max-width: 480px) {
    header { padding: 20px 15px; }
    header h1 { font-size: 1.1rem; }
    header p { font-size: 0.82rem; }
    form { padding: 20px 15px; }
    .form-group label { font-size: 0.9rem; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 11px 12px; font-size: 0.95rem;
    }
    .btn-submit { font-size: 1rem; padding: 13px; }
    .radio-group { gap: 8px; }
    .radio-group label { padding: 8px 12px; font-size: 0.88rem; }
    .success-content { padding: 25px 20px; }
    .success-icon { width: 70px; height: 70px; font-size: 2rem; }
    .success-content h2 { font-size: 1.25rem; }
    .success-content p { font-size: 0.92rem; }
    .btn-whatsapp { font-size: 0.98rem; padding: 13px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎓 النظام التقني الذكي</h1>
    <p>للمبرمج بهاء الدين الحسين</p>
    <p style="margin-top:6px; font-size:0.85rem; opacity:0.85;">التسجيل في جلسات أساسيات البرمجة</p>
  </header>

  <form id="registrationForm">
    <div class="form-group">
      <label for="fullName">الاسم الكامل *</label>
      <input type="text" id="fullName" required placeholder="اكتب اسمك الكامل">
    </div>

    <div class="form-group">
      <label>الجنس *</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="gender" value="ذكر" required>
          👨 ذكر
        </label>
        <label>
          <input type="radio" name="gender" value="أنثى" required>
          👩 أنثى
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="email">البريد الإلكتروني (اختياري)</label>
      <input type="email" id="email" placeholder="example@email.com">
    </div>

    <div class="form-group">
      <label for="phone">رقم الهاتف *</label>
      <input type="tel" id="phone" required placeholder="07xxxxxxxx">
    </div>

    <div class="form-group">
      <label for="age">العمر *</label>
      <input type="number" id="age" min="10" max="80" required placeholder="18">
    </div>

    <div class="form-group">
      <label for="city">المدينة *</label>
      <input type="text" id="city" required placeholder="مثال: دمشق">
    </div>

    <div class="form-group">
      <label for="education">الشهادة التعليمية (اختياري)</label>
      <select id="education">
        <option value="">-- اختر الشهادة --</option>
        <option value="ابتدائي">ابتدائي</option>
        <option value="إعدادي">إعدادي</option>
        <option value="ثانوي">ثانوي</option>
        <option value="معهد">معهد</option>
        <option value="جامعة">جامعة</option>
      </select>
    </div>

    <div class="form-group">
      <label>هل لديك خبرة سابقة في البرمجة؟ *</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="experience" value="نعم" required>
          ✅ نعم
        </label>
        <label>
          <input type="radio" name="experience" value="لا" required>
          ❌ لا
        </label>
      </div>
    </div>

    <div class="form-group">
      <label>الجلسات المطلوبة *</label>
      <input type="text" value="جلسات أساسيات البرمجة - النظام التقني الذكي للمبرمج بهاء الدين الحسين" disabled
             style="background:#eef2ff; font-weight:600; color:#2a5298;">
      <input type="hidden" id="course" value="جلسات أساسيات البرمجة - النظام التقني الذكي للمبرمج بهاء الدين الحسين">
    </div>

    <button type="submit" class="btn-submit">✅ تأكيد التسجيل</button>
  </form>
</div>

<div id="toast" class="toast"></div>

<!-- ============================================ -->
<!-- نافذة النجاح مع زر الواتساب -->
<!-- ============================================ -->
<div id="successModal" class="success-modal">
  <div class="success-content">
    <div class="success-icon">✅</div>
    <h2>تم تسجيلك بنجاح!</h2>
    <p>سيتم تحويلك تلقائياً إلى مجموعة الواتساب خلال لحظات...</p>
    <p class="note">إذا لم يتم التحويل تلقائياً، اضغط الزر أدناه:</p>
    <button class="btn-whatsapp" onclick="goToWhatsapp()">
      💬 الانضمام إلى مجموعة الواتساب
    </button>
    <button class="btn-close" onclick="closeModal()">إغلاق</button>
  </div>
</div>

<script>
  // ============================================
  // رابط Google Apps Script الخاص بك
  // ============================================
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwj2aPsOSYygXRbf-VIkeUuyg5hb8NRoQY-X7p0JwazYPOZX0FKZvrazBsRBK1NIMtAqQ/exec';

  // ============================================
  // رابط مجموعة الواتساب
  // ============================================
  const WHATSAPP_URL = 'https://chat.whatsapp.com/KzEZrjKeen2GBgAqkUIanG';

  document.getElementById('registrationForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const submitBtn = this.querySelector('.btn-submit');
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ جاري الإرسال...';

    const genderInput = document.querySelector('input[name="gender"]:checked');
    const experienceInput = document.querySelector('input[name="experience"]:checked');

    const formData = new URLSearchParams();
    formData.append('fullName', document.getElementById('fullName').value.trim());
    formData.append('gender', genderInput ? genderInput.value : '');
    formData.append('email', document.getElementById('email').value.trim());
    formData.append('phone', document.getElementById('phone').value.trim());
    formData.append('age', document.getElementById('age').value);
    formData.append('city', document.getElementById('city').value.trim());
    formData.append('education', document.getElementById('education').value);
    formData.append('experience', experienceInput ? experienceInput.value : '');
    formData.append('course', document.getElementById('course').value);
    formData.append('date', new Date().toLocaleString('ar-EG'));

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: formData,
      mode: 'no-cors'
    })
    .then(() => {
      document.getElementById('registrationForm').reset();
      showSuccessModal();
    })
    .catch(error => {
      console.error(error);
      showToast('❌ حدث خطأ، تحقق من الاتصال', true);
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = originalText;
    });
  });

  // ============================================
  // عرض نافذة النجاح مع التحويل التلقائي للواتساب
  // ============================================
  function showSuccessModal() {
    const modal = document.getElementById('successModal');
    modal.classList.add('show');

    // التحويل التلقائي للواتساب بعد ثانيتين
    setTimeout(() => {
      window.open(WHATSAPP_URL, '_blank');
    }, 2000);
  }

  function closeModal() {
    document.getElementById('successModal').classList.remove('show');
  }

  function goToWhatsapp() {
    window.open(WHATSAPP_URL, '_blank');
  }

  function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => toast.className = 'toast', 3000);
  }
</script>
</body>
</html>
